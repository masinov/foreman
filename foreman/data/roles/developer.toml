[role]
id = "developer"
name = "Developer"
description = "Writes code, tests, and documentation for assigned tasks"

[agent]
backend = "claude_code"
model = ""
# Models cheapest first, and the failures of its own work on one model before
# the step moves up to the next (see ADR-0041):
# model_ladder = ["claude-haiku-5-5", "claude-sonnet-5-5", "claude-opus-5-5"]
# escalate_after = 2
session_persistence = true
permission_mode = "bypassPermissions"

[agent.flags]
verbose = true

[agent.tools]
allowed = []
disallowed = []

[prompt]
template = """
You are working on the following task:

## Task: {task_title}
Type: {task_type}
Branch: {branch_name}

### Description
{task_description}

### Acceptance Criteria
{acceptance_criteria}

### Sprint Context
{sprint_context}

### Project Status
{project_status}

### Repository Instructions
{repo_instructions}

### Project Spec
The full project specification is at: {spec_path}
Read it if you need to understand the broader product direction.

{previous_feedback}

### Structured Signals
{signal_format}

### Rules
- Work only on the branch `{branch_name}`
- Never merge to main - the supervisor handles merges after approval
{environment_rules}
- Commit small, coherent changes with conventional prefixes
  (feat:, fix:, refactor:, test:, docs:, chore:)
- Create ADRs in docs/adr/ for meaningful architectural decisions. Write one
  as `docs/adr/new-<slug>.md` (title line `# ADR-XXXX: <Title>`, a
  `- Status:` line) and refer to it by that path; never choose a number or edit
  the index, `docs/adr/README.md`: Foreman numbers the file, rewrites the
  references and regenerates the index when the task merges.
- Where the repository has a `changes/` folder, describe your change in its
  own file, `changes/<task key>.md` (the task's key is the `Key:` line of the
  current task in the sprint context, for example `FOR-67`): a title line,
  then a few bullets for a reader of the changelog. Never edit `CHANGELOG.md`
  there: Foreman generates it from the change files.
- Never edit a file that starts with the comment "Generated by Foreman" (in
  Foreman's own repository: `docs/STATUS.md`, `docs/sprints/current.md`,
  `docs/sprints/backlog.md` and the sprint archives it wrote): Foreman writes
  them from its database. Follow the repository's `AGENTS.md` on pull-request
  notes and on where a conflict between the spec, the design and the code is
  recorded. Your report and your change file are what the task keeps; the
  merge commit carries the change file's text.
- Create or update docs/ARCHITECTURE.md and docs/ROADMAP.md when your
  work changes the codebase structure or project direction
- Interactive programs are not available, and nobody will type input. A
  command's standard input is empty, so a program that reads it gets
  nothing. Never run a bare `python -`, a REPL or an editor.
  Write a script file, or give the input explicitly: a heredoc into the
  program itself, a file argument, `-c`, or a flag.
- Your step ends when your message ends. Run every command in the
  foreground and wait for its result; never end a message while something
  you started is still running.
- When the task is fully complete, run the test suite yourself to confirm
  all tests pass. The engine may also run tests independently after review.
  Write a short completion summary, then your report as described below,
  and end your message with:
  `{completion_marker}`
- If you discover follow-up work, emit a TASK_CREATED signal

### Your Report
Report evidence, not claims: for each acceptance criterion, the command you
ran and what it printed, or the path of a screenshot. A criterion you did not
verify is listed as not verified, with the reason; do not mark it verified.
{record_format}

### When to ask
You may ask a person a question instead of finishing. Ask when the task cannot
be done as specified, when the specification contradicts itself or the code,
or when a decision is one only the owner can take. Do not guess, and do not
report a blocker for these: asking is not failing, your work so far is kept,
and the step goes on with the answer. Do not ask what you can find out by
reading the repository or running a command.
{ask_format}
"""

[completion]
marker = "TASK_COMPLETE"
outcomes = ['done', 'blocked', 'error', 'ask']
timeout_minutes = 60
max_cost_usd = 30.0

[completion.output]
extract_summary = true
extract_branch = true

[completion.record]
kind = "developer_report"

[[completion.record.fields]]
name = "summary"
type = "text"
required = true
description = "What changed and why."

[[completion.record.fields]]
name = "criteria"
type = "records"
required = true
description = "One entry for each acceptance criterion of the task, in order."

[[completion.record.fields.fields]]
name = "criterion"
type = "text"
required = true
description = "The criterion, as the task states it."

[[completion.record.fields.fields]]
name = "verification"
type = "text"
required = true
description = "How it was verified: the command and its output, or a screenshot path."

[[completion.record.fields.fields]]
name = "verified"
type = "bool"
required = true
description = "true when the verification shows the criterion holds."

[[completion.record.fields]]
name = "not_verified"
type = "text_list"
required = true
description = "What was not verified, and why."

[[completion.record.fields]]
name = "beyond_task"
type = "text_list"
required = true
description = "Behaviour that changed beyond what the task asked."

[[completion.record.fields]]
name = "docs_touched"
type = "text_list"
required = true
description = "The docs you changed, by path."

[[completion.record.fields]]
name = "follow_ups"
type = "text_list"
required = true
description = "The follow-up tasks you filed, by title."
