[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foreman"
dynamic = ["version"]
description = "Foreman is an autonomous development engine for spec-driven software delivery."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Foreman contributors"},
]
dependencies = [
  "fastapi>=0.115,<1",
  # Imported directly (models, responses, the test client); FastAPI brings
  # them, but what the code imports is declared here.
  "pydantic>=2,<3",
  "starlette>=0.40",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "tomli>=2.0.1; python_version < '3.11'",
  "tomlkit>=0.12",
]

[project.scripts]
foreman = "foreman.cli:main"

[tool.setuptools.packages.find]
include = ["foreman*"]

[tool.setuptools.package-data]
foreman = [
  "dashboard_frontend_dist/*.html",
  "dashboard_frontend_dist/assets/*",
  "data/roles/*.toml",
  "data/workflows/*.toml",
  "data/templates/*",
]

[tool.setuptools.dynamic]
# One place states the version: foreman/__init__.py.
version = {attr = "foreman.__version__"}

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  # The layers contract (.importlinter, ADR-0032); it needs Python 3.11.
  "import-linter>=2.5,<3; python_version >= '3.11'",
  # Runs the suite (its tests are unittest TestCases), one worker per core
  # with pytest-xdist (`-n auto`), and writes the JUnit XML the test step
  # counts (ADR-0035) with `--junitxml`.
  "pytest>=8,<9",
  "pytest-xdist>=3.5,<4",
]
e2e = [
  "playwright>=1.40,<2",
  "pytest-playwright>=0.5,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Real errors only for now: syntax errors and pyflakes. Style rules join once
# the large modules are split (see docs/reviews/2026-11-10-full-review-and-finish-plan.md).
select = ["E9", "F"]
