[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foreman"
dynamic = ["version"]
description = "Foreman is an autonomous development engine for spec-driven software delivery."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Foreman contributors"},
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "tomli>=2.0.1; python_version < '3.11'",
  "tomlkit>=0.12",
]

[project.scripts]
foreman = "foreman.cli:main"

[tool.setuptools.packages.find]
include = ["foreman*"]

[tool.setuptools.package-data]
foreman = [
  "dashboard_frontend_dist/*.html",
  "dashboard_frontend_dist/assets/*",
  "data/roles/*.toml",
  "data/workflows/*.toml",
  "data/templates/*",
]

[tool.setuptools.dynamic]
# One place states the version: foreman/__init__.py.
version = {attr = "foreman.__version__"}

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
]
e2e = [
  "playwright>=1.40,<2",
  "pytest-playwright>=0.5,<1",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Real errors only for now: syntax errors and pyflakes. Style rules join once
# the large modules are split (see docs/reviews/2026-11-10-full-review-and-finish-plan.md).
select = ["E9", "F"]
