name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m venv venv
          # tests/test_cli.py reinstalls the package with --no-build-isolation,
          # which needs setuptools in the environment (absent from 3.12 venvs).
          ./venv/bin/pip install setuptools wheel
          ./venv/bin/pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the dashboard frontend
        # The bundle is not in git; the tests that serve it need it built.
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
      - name: Lint
        run: ./venv/bin/ruff check foreman tests scripts
      - name: Repository memory
        run: ./venv/bin/python scripts/validate_repo_memory.py
      - name: Tests
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
          ./venv/bin/python -m unittest discover -s tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
